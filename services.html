<!DOCTYPE html>
<html>
<head>
    <title>Services — Apostu Financial Advisory</title>

    <style>
        #chatbot-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
}

#chatbot-button {
    background: #0a3d62;
    color: white;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

#chatbot-window {
    width: 300px;
    height: 400px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    display: none;
    flex-direction: column;
    overflow: hidden;
}

#chatbot-header {
    background: #0a3d62;
    color: white;
    padding: 10px;
    text-align: center;
    font-weight: bold;
}

#chatbot-messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    font-size: 14px;
}

#chatbot-input-area {
    display: flex;
    border-top: 1px solid #ccc;
}

#chatbot-input {
    flex: 1;
    padding: 10px;
    border: none;
    outline: none;
}

#chatbot-input-area button {
    background: #0a3d62;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
}

        :root {
            --primary: #0a3d62;
            --secondary: #1e5799;
            --light-bg: #f5f7fa;
            --light-text: #333;
            --dark-bg: #1b1b1b;
            --dark-text: #e6e6e6;
        }
<div id="chatbot-container">
    <div id="chatbot-button" onclick="toggleChatbot()">💬</div>

    <div id="chatbot-window">
        <div id="chatbot-header">Apostu Assistant</div>
        <div id="chatbot-messages"></div>

        <div id="chatbot-input-area">
            <input id="chatbot-input" type="text" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--light-bg);
            color: var(--light-text);
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: var(--dark-bg);
            color: var(--dark-text);
        }

        header {
            background: var(--primary);
            color: white;
            padding: 25px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-btn {
            background: white;
            color: var(--primary);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .section {
            padding: 50px 20px;
            max-width: 1000px;
            margin: auto;
        }

        footer {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark");
        }
    </script>
</head>

<body>

<header>
    <div class="logo">Apostu Financial Advisory</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="toggle-btn" onclick="toggleDarkMode()">Dark Mode</div>
</header>

<section class="section">
    <h2>Our Services</h2>
    <ul>
        <li>Financial Planning</li>
        <li>Investment Guidance</li>
        <li>Retirement Strategy</li>
        <li>Business Financial Consulting</li>
    </ul>
</section>

<footer>
    © 2026 Apostu Financial Advisory
</footer>

</body>
</html>
